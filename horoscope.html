
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aaj Ka Rashifal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf8f3;
      color: #29213d;
    }

    header {
      background: #30204f;
      color: white;
      padding: 18px 6%;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav {
      max-width: 1000px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-actions {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    #languageButton {
      padding: 8px 12px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    a {
      color: inherit;
    }

    .home-link {
      color: #f5c96b;
      text-decoration: none;
    }

    main {
      max-width: 850px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .panel {
      background: white;
      border-radius: 16px;
      padding: 30px 22px;
      box-shadow: 0 3px 14px rgba(40,25,65,.06);
    }

    .sign-icon {
      width: 120px;
      height: 120px;
      object-fit: contain;
      display: block;
      margin: 0 auto 12px;
    }

    h1, .subtitle {
      text-align: center;
    }

    h1 {
      color: #493365;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
    }

    .periods {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 25px 0;
    }

    .periods a {
      padding: 10px 17px;
      border: 1px solid #ded5eb;
      border-radius: 22px;
      text-decoration: none;
      color: #493365;
    }

    .periods a.active {
      background: #493365;
      color: white;
    }

    .content {
      background: #faf8f3;
      border-radius: 12px;
      padding: 20px;
      line-height: 1.8;
      text-align: center;
    }

    .content section {
      margin-bottom: 24px;
    }

    .content h3 {
      color: #493365;
      margin-bottom: 8px;
    }

    .content p {
      white-space: pre-line;
    }

    .date {
      color: #8a6caa;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    @media (max-width: 480px) {
      .nav {
        flex-wrap: wrap;
      }

      .nav-actions {
        gap: 10px;
      }

      .panel {
        padding: 22px 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">
    <strong>✦ Aaj Ka Rashifal</strong>

    <div class="nav-actions">
      <button id="languageButton" onclick="toggleLanguage()">
        English
      </button>

      <a class="home-link" href="index.html" id="homeLink">
        ← होम
      </a>
    </div>
  </div>
</header>

<main>
  <section class="panel">

    <img class="sign-icon" id="signIcon" src="" alt="">

    <h1 id="signName">राशिफल</h1>

    <p class="subtitle" id="signEnglish"></p>

    <p class="date" id="todayDate"></p>

    <nav class="periods">
      <a href="#" data-period="today">आज</a>
      <a href="#" data-period="week">साप्ताहिक</a>
      <a href="#" data-period="month">मासिक</a>
      <a href="#" data-period="year">वार्षिक</a>
    </nav>

    <div class="content">
      <h2 id="periodTitle">आज का राशिफल</h2>

      <div id="horoscopeContent"></div>
    </div>

  </section>
</main>

<footer>© 2026 Aaj Ka Rashifal</footer>

<script>

// Google Apps Script API
const API_URL = "https://script.google.com/macros/s/AKfycbzeL8GUKUSWh4iSKnfbF0h2jQTCzDfBDKNpYjCryc6A6UR0o6kPOABmNr-t9la4oKCihg/exec";

// Zodiac signs
const signs = {
  ARIES: ["मेष", "Aries", "aries.png"],
  TAURUS: ["वृषभ", "Taurus", "taurus.png"],
  GEMINI: ["मिथुन", "Gemini", "gemini.png"],
  CANCER: ["कर्क", "Cancer", "cancer.png"],
  LEO: ["सिंह", "Leo", "leo.png"],
  VIRGO: ["कन्या", "Virgo", "virgo.png"],
  LIBRA: ["तुला", "Libra", "libra.png"],
  SCORPIO: ["वृश्चिक", "Scorpio", "scorpio.png"],
  SAGITTARIUS: ["धनु", "Sagittarius", "sagittarius.png"],
  CAPRICORN: ["मकर", "Capricorn", "capricorn.png"],
  AQUARIUS: ["कुंभ", "Aquarius", "aquarius.png"],
  PISCES: ["मीन", "Pisces", "pisces.png"]
};

// URL parameters
const params = new URLSearchParams(window.location.search);

const signId = (params.get("sign") || "ARIES").toUpperCase();
const period = params.get("period") || "today";
const sign = signs[signId] || signs.ARIES;

// Remember visitor's language
let currentLanguage =
  localStorage.getItem("rashifalLanguage") || "hi";

let horoscopeData = null;

// Set zodiac icon
document.getElementById("signIcon").src =
  "icons/" + sign[2];

document.getElementById("signIcon").alt = sign[1];

// Update date according to selected period and language
function updateDate() {

  const now = new Date();
  const locale = currentLanguage === "hi" ? "hi-IN" : "en-IN";

  const dateDisplay = document.getElementById("todayDate");

  if (period === "today") {

    dateDisplay.textContent = now.toLocaleDateString(locale, {
      day: "numeric",
      month: "long",
      year: "numeric"
    });

  } else if (period === "week") {

    const weekStart = new Date(now);
    weekStart.setDate(now.getDate() - now.getDay());

    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 6);

    const startText = weekStart.toLocaleDateString(locale, {
      day: "numeric",
      month: "long"
    });

    const endText = weekEnd.toLocaleDateString(locale, {
      day: "numeric",
      month: "long",
      year: "numeric"
    });

    dateDisplay.textContent = startText + " – " + endText;

  } else if (period === "month") {

    dateDisplay.textContent = now.toLocaleDateString(locale, {
      month: "long",
      year: "numeric"
    });

  } else if (period === "year") {

    dateDisplay.textContent = now.getFullYear();

  }
}

// Lucky colour translation
function getLuckyColor(color) {

  if (currentLanguage === "hi") {
    return color;
  }

  const colors = {
    "पीला": "Yellow",
    "लाल": "Red",
    "हरा": "Green",
    "नीला": "Blue",
    "सफेद": "White",
    "काला": "Black",
    "गुलाबी": "Pink",
    "नारंगी": "Orange",
    "बैंगनी": "Purple",
    "भूरा": "Brown"
  };

  return colors[color] || color;
}

// Add horoscope section
function addSection(container, title, value) {

  const section = document.createElement("section");

  const heading = document.createElement("h3");
  heading.textContent = title;

  const paragraph = document.createElement("p");
  paragraph.textContent = value || (
    currentLanguage === "hi"
      ? "जानकारी उपलब्ध नहीं है।"
      : "Information not available."
  );

  section.appendChild(heading);
  section.appendChild(paragraph);

  container.appendChild(section);
}

// Display horoscope in selected language
function renderHoroscope() {

  if (!horoscopeData) return;

  const data = horoscopeData;

  const container =
    document.getElementById("horoscopeContent");

  container.innerHTML = "";

  const hi = currentLanguage === "hi";

  addSection(
    container,
    hi ? "सामान्य राशिफल" : "Overall Horoscope",
    hi ? data.Overall_HI : data.Overall_EN
  );

  addSection(
    container,
    hi ? "करियर" : "Career",
    hi ? data.Career_HI : data.Career_EN
  );

  addSection(
    container,
    hi ? "धन और वित्त" : "Finance",
    hi ? data.Finance_HI : data.Finance_EN
  );

  addSection(
    container,
    hi ? "प्रेम और संबंध" : "Love & Relationships",
    hi ? data.Love_HI : data.Love_EN
  );

  addSection(
    container,
    hi ? "स्वास्थ्य" : "Health",
    hi ? data.Health_HI : data.Health_EN
  );

  addSection(
    container,
    hi ? "आज का शुभ रंग" : "Lucky Colour",
    getLuckyColor(data.Lucky_Color)
  );

  addSection(
    container,
    hi ? "शुभ अंक" : "Lucky Number",
    data.Lucky_Number
  );

  addSection(
    container,
    hi ? "विशेष सलाह" : "Special Advice",
    hi ? data.Advice_HI : data.Advice_EN
  );

}

// Apply language to the complete page
function applyLanguage() {

  const hi = currentLanguage === "hi";

  document.documentElement.lang = currentLanguage;

  document.getElementById("languageButton").textContent =
    hi ? "English" : "हिन्दी";

  document.getElementById("signName").textContent =
    hi ? sign[0] : sign[1];

  document.getElementById("signEnglish").textContent =
    hi ? sign[1] : sign[0];

  document.getElementById("homeLink").textContent =
    hi ? "← होम" : "← Home";

  const periodNames = {
    today: hi ? "आज" : "Today",
    week: hi ? "साप्ताहिक" : "Weekly",
    month: hi ? "मासिक" : "Monthly",
    year: hi ? "वार्षिक" : "Yearly"
  };

  document.querySelectorAll(".periods a").forEach(link => {

    link.textContent = periodNames[link.dataset.period];

    link.href =
      `horoscope.html?sign=${signId}&period=${link.dataset.period}`;

    if (link.dataset.period === period) {
      link.classList.add("active");
    } else {
      link.classList.remove("active");
    }

  });

  const titles = {
    today: hi ? "आज का राशिफल" : "Today's Horoscope",
    week: hi ? "साप्ताहिक राशिफल" : "Weekly Horoscope",
    month: hi ? "मासिक राशिफल" : "Monthly Horoscope",
    year: hi ? "वार्षिक राशिफल" : "Yearly Horoscope"
  };

  document.getElementById("periodTitle").textContent =
    titles[period] || titles.today;

  updateDate();
  renderHoroscope();

  document.title =
    hi ? "राशिफल | Aaj Ka Rashifal" : "Horoscope | Aaj Ka Rashifal";

}
function showLoadingMessage() {
  document.getElementById("horoscopeContent").textContent =
    currentLanguage === "hi"
      ? "राशिफल लोड हो रहा है..."
      : "Loading horoscope...";
}

// Change language and save preference
function toggleLanguage() {

  currentLanguage =
    currentLanguage === "hi" ? "en" : "hi";

  localStorage.setItem(
    "rashifalLanguage",
    currentLanguage
  );

  applyLanguage();

}

// Load saved language when page opens
applyLanguage();
showLoadingMessage();
// Fetch horoscope data
fetch(
  `${API_URL}?sign=${encodeURIComponent(signId)}&period=${encodeURIComponent(period)}`
)

.then(response => response.json())

.then(result => {

  if (!result.success) {
    throw new Error(result.error || "Horoscope not available.");
  }

  horoscopeData = result.data;

  renderHoroscope();

})

.catch(error => {

  document.getElementById("horoscopeContent").textContent =
    currentLanguage === "hi"
      ? "राशिफल लोड नहीं हो पाया। कृपया बाद में प्रयास करें।"
      : "Unable to load horoscope. Please try again later.";

  console.error(error);

});

</script>

</body>
</html>
